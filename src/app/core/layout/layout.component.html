<div class="flex min-h-dvh flex-col bg-neo-base text-neo-white">
  <app-header (authRequested)="openAuthModal($event)" />

  @if (!isOnline()) {
    <aside
      class="sticky top-16 z-50 mx-auto w-full max-w-5xl rounded-b-neo-lg border border-neo-red/30 bg-neo-red-dim p-4 text-center text-small text-neo-white shadow-neo-card backdrop-blur-md"
      role="alert"
      aria-live="assertive"
    >
      <strong>Sin conexion.</strong> Por favor conectate a internet para poder seguir.
    </aside>
  }

  <app-page-wrapper>
    <router-outlet />
  </app-page-wrapper>

  <app-neo-modal
    [open]="authModalOpen()"
    [title]="authModalMode() === 'login' ? 'Iniciar sesión' : 'Crear cuenta'"
    size="sm"
    (close)="closeAuthModal()"
  >
    @if (authModalMode() === 'login') {
      <app-login-page
        [embeddedMode]="true"
        (switchToRegister)="authModalMode.set('register')"
        (authSuccess)="closeAuthModal()"
      />
    } @else {
      <app-register-page
        [embeddedMode]="true"
        (switchToLogin)="authModalMode.set('login')"
        (authSuccess)="closeAuthModal()"
      />
    }
  </app-neo-modal>

  <app-footer />
  <app-chatbot-widget />
</div>
