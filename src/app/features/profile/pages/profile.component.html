<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="flex flex-col md:flex-row gap-8">
    <aside class="w-full md:w-60 shrink-0">
      <neo-card [padding]="'none'">
        <nav class="p-2">
          <a
            routerLink="/perfil"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-3 px-3 py-2.5 rounded-neo-md text-sm font-medium text-neo-muted hover:text-neo-white hover:bg-neo-elevated transition-neo duration-neo w-full"
          >
            <lucide-angular [img]="icons.user" [size]="16" [strokeWidth]="2"></lucide-angular>
            Mi informacion
          </a>
          <a
            routerLink="/perfil/direcciones"
            routerLinkActive="active-link"
            class="flex items-center gap-3 px-3 py-2.5 rounded-neo-md text-sm font-medium text-neo-muted hover:text-neo-white hover:bg-neo-elevated transition-neo duration-neo w-full"
          >
            <lucide-angular [img]="icons.mapPin" [size]="16" [strokeWidth]="2"></lucide-angular>
            Mis direcciones
          </a>
          <a
            routerLink="/perfil/favoritos"
            routerLinkActive="active-link"
            class="flex items-center gap-3 px-3 py-2.5 rounded-neo-md text-sm font-medium text-neo-muted hover:text-neo-white hover:bg-neo-elevated transition-neo duration-neo w-full"
          >
            <lucide-angular [img]="icons.heart" [size]="16" [strokeWidth]="2"></lucide-angular>
            Mis favoritos
          </a>
          <a
            routerLink="/pedidos"
            routerLinkActive="active-link"
            class="flex items-center gap-3 px-3 py-2.5 rounded-neo-md text-sm font-medium text-neo-muted hover:text-neo-white hover:bg-neo-elevated transition-neo duration-neo w-full"
          >
            <lucide-angular [img]="icons.package" [size]="16" [strokeWidth]="2"></lucide-angular>
            Mis pedidos
          </a>
          <a
            routerLink="/perfil/seguridad"
            routerLinkActive="active-link"
            class="flex items-center gap-3 px-3 py-2.5 rounded-neo-md text-sm font-medium text-neo-muted hover:text-neo-white hover:bg-neo-elevated transition-neo duration-neo w-full"
          >
            <lucide-angular [img]="icons.shield" [size]="16" [strokeWidth]="2"></lucide-angular>
            Seguridad
          </a>

          @if (!isSeller()) {
            <div class="mt-4 border-t border-neo-border pt-4">
              <a
                routerLink="/perfil/activar-vendedor"
                routerLinkActive="active-link"
                class="flex w-full items-center gap-3 rounded-neo-md px-3 py-2.5 text-sm font-medium text-neo-cyan transition-neo duration-neo hover:bg-neo-elevated hover:text-neo-white"
              >
                <lucide-angular [img]="icons.store" [size]="16" [strokeWidth]="2"></lucide-angular>
                Quiero vender
              </a>
            </div>
          }

          @if (isSeller()) {
            <div class="mt-4 border-t border-neo-border pt-4">
              <a
                routerLink="/vendedor/dashboard"
                class="flex w-full items-center gap-3 rounded-neo-md px-3 py-2.5 text-sm font-medium text-neo-green transition-neo duration-neo hover:bg-neo-elevated hover:text-neo-white"
              >
                <lucide-angular [img]="icons.dashboard" [size]="16" [strokeWidth]="2"></lucide-angular>
                Panel de vendedor
              </a>
            </div>
          }

          <div class="mt-2 border-t border-neo-border pt-2">
            <app-neo-button variant="ghost" fullWidth [loading]="loggingOut()" (neoClick)="logout()">
              <lucide-angular [img]="icons.logout" [size]="16" [strokeWidth]="2"></lucide-angular>
              Cerrar sesion
            </app-neo-button>
          </div>
        </nav>
      </neo-card>
    </aside>

    <main class="flex-1 min-w-0">
      <router-outlet />
    </main>
  </div>
</div>
