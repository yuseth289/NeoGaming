<div class="space-y-6">
  <neo-card [padding]="'md'">
    <div class="flex items-center gap-5">
      <div class="w-20 h-20 rounded-full bg-neo-red flex items-center justify-center text-white text-2xl font-bold shrink-0 overflow-hidden">
        @if (avatarPreview()) {
          <img class="h-full w-full object-cover" [src]="avatarPreview()!" alt="Foto de perfil" />
        } @else {
          {{ avatarInitials() }}
        }
      </div>
      <div>
        <p class="text-sm font-medium text-neo-white">Foto de perfil</p>
        <p class="text-xs text-neo-muted-text mb-2">URL de imagen publica</p>
        <input
          #fileInput
          class="hidden"
          type="file"
          accept="image/*"
          aria-label="Seleccionar foto de perfil"
          (change)="onAvatarSelected($event)"
        />
        <app-neo-button variant="ghost" size="sm" type="button" (neoClick)="fileInput.click()">Cambiar foto</app-neo-button>
      </div>
    </div>
  </neo-card>

  <neo-card [padding]="'md'">
    <h2 class="text-h4 font-semibold text-neo-white mb-5">Mi informacion</h2>
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
      <app-neo-input
        label="Nombre completo"
        formControlName="nombre"
        [error]="fieldError('nombre')"
      ></app-neo-input>
      <app-neo-input
        label="Email"
        type="email"
        formControlName="email"
        [error]="fieldError('email')"
      ></app-neo-input>
      <app-neo-input
        label="URL foto de perfil"
        formControlName="fotoPerfilUrl"
        hint="Opcional"
        [error]="fieldError('fotoPerfilUrl')"
      ></app-neo-input>
      <div class="pt-2">
        <app-neo-button variant="primary" size="md" type="submit" [loading]="saving()">
          Guardar cambios
        </app-neo-button>
      </div>
    </form>
  </neo-card>
</div>
