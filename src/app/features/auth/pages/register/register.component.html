<div [class]="embeddedMode() ? 'flex items-center justify-center px-0 py-0' : 'min-h-screen flex items-center justify-center px-4 py-12 bg-neo-base'">
  <div class="w-full max-w-md">
    <neo-card [padding]="'none'">
      <div class="p-8">
        <div class="text-center mb-2">
          <span class="font-mono font-bold text-2xl tracking-tight">
            <span class="text-neo-red-text">NEO</span><span class="text-neo-white">GAMING</span>
          </span>
        </div>

        <h2 class="text-2xl font-bold text-neo-white text-center mb-1">Crea tu cuenta</h2>
        <p class="text-sm text-neo-muted-text text-center mb-6">
          ¿Ya tienes cuenta?
          @if (embeddedMode()) {
            <button
              type="button"
              class="text-neo-cyan font-semibold hover:underline ml-1"
              (click)="switchToLogin.emit()"
            >
              Inicia sesión
            </button>
          } @else {
            <a routerLink="/login" class="text-neo-cyan font-semibold hover:underline ml-1">Inicia sesión</a>
          }
        </p>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="space-y-4">
            <neo-input
              label="Nombre completo"
              placeholder="Tu nombre"
              icon="user"
              formControlName="name"
              [error]="fieldError('name')"
            />
            <neo-input
              label="Email"
              type="email"
              placeholder="tu@email.com"
              icon="mail"
              formControlName="email"
              [error]="fieldError('email')"
            />
            <neo-input
              label="Teléfono"
              type="text"
              placeholder="+57 300 000 0000"
              icon="phone"
              hint="Opcional"
              formControlName="phone"
              [error]="fieldError('phone')"
            />
            <neo-input
              label="Contraseña"
              type="password"
              placeholder="Mínimo 8 caracteres"
              icon="lock"
              formControlName="password"
              [error]="fieldError('password')"
            />
            <neo-input
              label="Confirmar contraseña"
              type="password"
              placeholder="Repite tu contraseña"
              icon="lock"
              formControlName="confirmPassword"
              [error]="fieldError('confirmPassword')"
            />
          </div>

          <div class="flex items-center justify-center gap-2 mt-4 mb-2">
            <input
              type="checkbox"
              id="terms"
              formControlName="terms"
              class="w-4 h-4 accent-neo-red cursor-pointer"
            />
            <label for="terms" class="text-xs text-neo-muted-text uppercase tracking-widest cursor-pointer">
              Acepto los términos y condiciones
            </label>
          </div>
          @if (termsError()) {
            <p class="mb-2 text-center text-xs text-red-400">Debes aceptar los términos para continuar.</p>
          }

          <button
            type="submit"
            [disabled]="loading()"
            class="w-full h-12 rounded-neo-md bg-neo-red hover:bg-neo-red-dim disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold text-base transition-neo duration-neo flex items-center justify-center gap-2 mt-2"
          >
            @if (loading()) {
              <neo-spinner size="sm" />
            }
            {{ submitLabel }}
          </button>
        </form>
      </div>
    </neo-card>
  </div>
</div>
