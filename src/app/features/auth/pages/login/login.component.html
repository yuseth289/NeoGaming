<div [class]="embeddedMode() ? 'flex items-center justify-center px-0 py-0' : 'min-h-screen flex items-center justify-center px-4 py-12 bg-neo-base'">
  <div class="w-full max-w-md">
    <neo-card [padding]="'none'">
      <div class="p-8">
        <div class="text-center mb-2">
          <span class="font-mono font-bold text-2xl tracking-tight">
            <span class="text-neo-red-text">NEO</span><span class="text-neo-white">GAMING</span>
          </span>
        </div>

        <h2 class="text-2xl font-bold text-neo-white text-center mb-1">Bienvenido de vuelta</h2>
        <p class="text-sm text-neo-muted-text text-center mb-6">
          ¿No tienes cuenta?
          @if (embeddedMode()) {
            <button
              type="button"
              class="text-neo-cyan font-semibold hover:underline ml-1"
              (click)="switchToRegister.emit()"
            >
              Regístrate
            </button>
          } @else {
            <a routerLink="/registro" class="text-neo-cyan font-semibold hover:underline ml-1">Regístrate</a>
          }
        </p>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="space-y-4">
            <neo-input
              label="Email"
              type="email"
              placeholder="tu@email.com"
              icon="mail"
              formControlName="email"
              [error]="fieldError('email')"
            />

            <neo-input
              label="Contraseña"
              type="password"
              placeholder="Mínimo 8 caracteres"
              icon="lock"
              formControlName="password"
              [error]="fieldError('password')"
            />
          </div>

          <div class="flex justify-end mt-1 mb-4">
            <a href="#" class="text-xs text-neo-cyan hover:underline">¿Olvidaste tu contraseña?</a>
          </div>

          <button
            type="submit"
            [disabled]="loading()"
            class="w-full h-12 rounded-neo-md bg-neo-red hover:bg-neo-red-dim disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold text-base transition-neo duration-neo flex items-center justify-center gap-2 mt-2"
          >
            @if (loading()) {
              <neo-spinner size="sm" />
            }
            {{ submitLabel }}
          </button>
        </form>

        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-neo-border"></div>
          </div>
          <div class="relative flex justify-center">
            <span class="px-3 bg-neo-surface text-xs text-neo-muted-text uppercase tracking-widest">
              o continúa con
            </span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="min-h-11 rounded-neo-md border border-neo-border text-neo-subtle text-sm font-medium hover:border-neo-border-bright hover:text-neo-white transition-neo duration-neo">
            Google
          </button>
          <button type="button" class="min-h-11 rounded-neo-md border border-neo-border text-neo-subtle text-sm font-medium hover:border-neo-border-bright hover:text-neo-white transition-neo duration-neo">
            Discord
          </button>
        </div>
      </div>
    </neo-card>
  </div>
</div>
